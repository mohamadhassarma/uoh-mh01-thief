[project]
name = "uoh-mh01"
version = "0.1.0"
description = "Thief agent — distributed cops-and-robbers over P2P (University of Haifa, Orchestration of AI Agents)"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uoh_mh01"]

[tool.pytest.ini_options]
testpaths = ["tests"]
