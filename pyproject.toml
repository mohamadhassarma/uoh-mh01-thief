[project]
name = "uoh-mh01"
version = "0.1.0"
description = "Thief agent — distributed cops-and-robbers over P2P (University of Haifa, Orchestration of AI Agents)"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uoh_mh01"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.coverage.run]
source = ["src"]
# These three are only exercised end-to-end by the real dual-subprocess
# integration test (test_integration_two_peers.py) — coverage.py cannot see
# execution that happens in a separate OS process, so it under-reports them
# even though they ARE tested, just not in-process. Matches the reference
# implementation's own pyproject.toml omission list for the same reason.
omit = [
    "*/__main__.py",
    "*/infra/mcp_server.py",
    "*/infra/mcp_client.py",
    "*/infra/peer_entrypoint.py",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
