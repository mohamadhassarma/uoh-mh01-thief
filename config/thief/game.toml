version = "1.10"

[game]
group_name = "Hassarma-Agents"
group_id = "uoh-mh01"
sub_game_number = 1
members = ["id-0000", "id-0000"]
repos = { cop = "https://github.com/mohamadhassarma/uoh-mh01-police", thief = "https://github.com/mohamadhassarma/uoh-mh01-thief" }

[network]
my_port = 8802                              # MY MCP server port
opponent_url = "https://perdurable-mireille-nonzoologically.ngrok-free.dev/mcp" # the only thing I know about the opponent
turn_timeout_seconds = 180

[strategy]
# PRD-05: BOTH classes are required, because roles alternate across a series
# (odd sub-games natural role, even sub-games swapped). A missing entry is not
# an error - `resolve_strategy(None, ...)` legitimately falls back to the
# shipped random baseline - so an unset class is silent, and it was: every
# thief-role sub-game we played ran the random baseline. See README section 5.
police_class = "uoh_mh01.domain.police_brain:ContainmentPoliceBrain"
thief_class = "uoh_mh01.domain.thief_brain:EvasiveThiefBrain"

[trash_talk]
# HOW the banter is produced. The MOVE is always pure Python.
provider = "template"   # template (0 tokens, default) | ollama | claude_api | claude_cli

[llm]
model = "claude-opus-4-8[1m]"
step_deadline_seconds = 30

